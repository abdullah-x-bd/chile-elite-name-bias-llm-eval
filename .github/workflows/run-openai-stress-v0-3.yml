name: Run OpenAI Stress v0.3

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI model to use
        required: true
        default: gpt-5.4
      run_id:
        description: Run ID for this stress run
        required: true
        default: stress_v0_3_openai_gpt54_001

jobs:
  run-stress:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate stress test datasets
        run: python scripts/generate_stress_tests.py

      - name: Run OpenAI stress v0.3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ github.event.inputs.model }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          PROMPT_FILE: prompts/stress_full_v0_3.jsonl
          OUTPUT_FILE: stress_openai_outputs_v0_3.jsonl
        run: python scripts/run_pilot_openai.py

      - name: Upload stress outputs
        uses: actions/upload-artifact@v4
        with:
          name: openai-stress-outputs-v0-3
          path: outputs/stress_openai_outputs_v0_3.jsonl
          if-no-files-found: error
