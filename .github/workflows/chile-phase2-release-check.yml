name: Chile Phase II Release Integrity

on:
  pull_request:
    paths:
      - 'phase2/results/raw_release/**'
      - 'phase2/results/PRIMARY_VERIFICATION.json'
      - 'phase2/results/RESULTS.md'
      - 'phase2/paper/**'
      - 'phase2/scripts/restore_raw_release.py'
      - '.github/workflows/chile-phase2-release-check.yml'

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify durable accepted-output archive
        working-directory: phase2
        run: python scripts/restore_raw_release.py
      - name: Check release certificate and manuscript inputs
        working-directory: phase2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cert=json.loads(Path('results/PRIMARY_VERIFICATION.json').read_text())
          assert cert['status']=='PASS'
          assert cert['rows']==8256 and cert['expected_rows']==8256
          assert cert['unique_request_identities']==8256
          assert not cert['failures']
          for name in ['generated_abstract.tex','generated_primary_results.tex','generated_robustness_results.tex','generated_discussion.tex']:
              p=Path('paper')/name
              assert p.exists() and p.stat().st_size>100, name
          print('PHASE II DURABLE RELEASE INTEGRITY: PASS')
          PY
      - name: Compile-check release Python utilities
        working-directory: phase2
        run: python -m py_compile scripts/restore_raw_release.py scripts/verify_primary.py scripts/analyze_results.py
