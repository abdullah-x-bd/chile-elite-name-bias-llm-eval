name: Chile Phase II Finalize Amendment 9

on:
  pull_request:
    paths:
      - 'phase2/execution/amendment9_trigger.txt'

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

jobs:
  mistral9:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify Amendment 9
        working-directory: phase2
        run: python scripts/verify_amendment9.py
      - name: Gate against actual OpenRouter account balance
        working-directory: phase2
        run: |
          python scripts/capture_openrouter_usage.py --label before_amendment9
          python - <<'PY'
          import json
          x=json.load(open('results/openrouter_usage_before_amendment9.json'))
          usage=float(x['usage_usd'])
          allowance=0.02
          ceiling=7.24
          if usage+allowance>ceiling:
              raise SystemExit(f'AMENDMENT 9 BUDGET GATE: STOP ${usage:.6f}+${allowance:.2f}>${ceiling:.2f}')
          print(f'AMENDMENT 9 BUDGET GATE: PASS usage=${usage:.6f}, allowance=${allowance:.2f}, ceiling=${ceiling:.2f}')
          PY
      - name: Rerun only the semantic-invalid Mistral cell
        working-directory: phase2
        run: python scripts/run_mistral_amendment9.py
      - uses: actions/upload-artifact@v4
        with:
          name: mistral-amendment9-cell
          path: |
            phase2/results/mistral_amendment9.jsonl
            phase2/results/openrouter_usage_before_amendment9.json
          if-no-files-found: error
          retention-days: 30

  analyze:
    needs: mistral9
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify complete amendment chain
        working-directory: phase2
        run: |
          python scripts/verify_amendment4.py
          python scripts/verify_amendment5.py
          python scripts/verify_amendment6.py
          python scripts/verify_amendment7.py
          python scripts/verify_amendment8.py
          python scripts/verify_amendment9.py
      - name: Recover five original complete model artifacts
        run: |
          mkdir -p phase2/results/raw
          gh run download 31397776217 -n primary-gpt54mini -D phase2/results/raw
          gh run download 31397776217 -n primary-gemini36flash -D phase2/results/raw
          gh run download 31397776217 -n primary-qwen37max -D phase2/results/raw
          gh run download 31397776217 -n primary-mistral_medium35 -D phase2/results/raw
          gh run download 31397776217 -n primary-llama4_maverick -D phase2/results/raw
      - name: Recover completed Nano and DeepSeek repair shards
        run: |
          mkdir -p phase2/results/recovered-shards
          for i in 0 1 2 3; do gh run download 31403135308 -n final-gptnano-shard-$i -D phase2/results/recovered-shards; done
          for i in 0 1 2 3; do gh run download 31403135308 -n final-deepseek-shard-$i -D phase2/results/recovered-shards; done
          cat phase2/results/recovered-shards/gpt54nano_shard*.jsonl > phase2/results/raw/gpt54nano.jsonl
          cat phase2/results/recovered-shards/deepseek_v32_shard*.jsonl > phase2/results/raw/deepseek_v32.jsonl
      - name: Recover six Claude Amendment 7 shards and two Amendment 8 shards
        run: |
          mkdir -p phase2/results/claude-shards
          for i in 0 2 3 4 5 6; do gh run download 31405985125 -n final-claude7-shard-$i -D phase2/results/claude-shards; done
          gh run download 31407489803 -n final-claude8-shard-1 -D phase2/results/claude-shards
          gh run download 31407489803 -n final-claude8-shard-7 -D phase2/results/claude-shards
          cat phase2/results/claude-shards/claude_sonnet5_*_shard*.jsonl > phase2/results/raw/claude_sonnet5.jsonl
      - name: Download Amendment 9 cell and patch only that Mistral observation
        uses: actions/download-artifact@v4
        with:
          name: mistral-amendment9-cell
          path: phase2/results/a9
      - name: Apply one-cell Amendment 9 replacement
        working-directory: phase2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          target='assoc::common_frequency::flores::school_sector::1'
          path=Path('results/raw/mistral_medium35.jsonl')
          rows=[json.loads(x) for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]
          replacement=json.loads(Path('results/a9/mistral_amendment9.jsonl').read_text(encoding='utf-8').strip())
          old=[r for r in rows if r.get('prompt_id')==target]
          if len(old)!=1: raise SystemExit(f'Expected one original Mistral target row, found {len(old)}')
          if replacement.get('prompt_id')!=target or replacement.get('parse_status')!='ok': raise SystemExit('Invalid Amendment 9 replacement')
          rows=[r for r in rows if r.get('prompt_id')!=target]+[replacement]
          if len(rows)!=1032 or len({r['prompt_id'] for r in rows})!=1032: raise SystemExit('Patched Mistral artifact is not exactly 1,032 unique prompt cells')
          path.write_text(''.join(json.dumps(r,ensure_ascii=False,sort_keys=True)+'\n' for r in rows),encoding='utf-8')
          print('AMENDMENT 9 PATCH APPLIED: exactly one Mistral observation replaced')
          PY
      - name: Assert per-model row counts before verifier
        run: |
          for f in phase2/results/raw/*.jsonl; do echo "$(basename "$f") $(grep -c . "$f")"; done
          test "$(grep -c . phase2/results/raw/claude_sonnet5.jsonl)" -eq 1032
          test "$(grep -c . phase2/results/raw/gpt54nano.jsonl)" -eq 1032
          test "$(grep -c . phase2/results/raw/deepseek_v32.jsonl)" -eq 1032
          test "$(grep -c . phase2/results/raw/mistral_medium35.jsonl)" -eq 1032
      - name: Capture final OpenRouter usage and robustness gate disposition
        working-directory: phase2
        run: |
          python scripts/capture_openrouter_usage.py --label final_primary_complete
          python - <<'PY'
          import json
          from pathlib import Path
          usage=float(json.load(open('results/openrouter_usage_final_primary_complete.json'))['usage_usd'])
          allowance=0.80
          ceiling=6.75
          executed=usage+allowance<=ceiling
          disposition={
            'protocol':'robustness-v1',
            'predeclared_calls':1300,
            'live_usage_after_primary_usd':usage,
            'predeclared_additional_allowance_usd':allowance,
            'predeclared_project_ceiling_usd':ceiling,
            'budget_gate_passed':executed,
            'status':'eligible_to_execute' if executed else 'predeclared_but_unexecuted_budget_gate_failed'
          }
          Path('results/robustness_disposition.json').write_text(json.dumps(disposition,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(disposition,indent=2,sort_keys=True))
          PY
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy matplotlib statsmodels
      - name: Verify exact 8,256-row primary release
        working-directory: phase2
        run: python scripts/verify_primary.py
      - name: Run frozen primary analysis
        working-directory: phase2
        run: python scripts/analyze_results.py
      - name: Upload final verified primary research artifact
        uses: actions/upload-artifact@v4
        with:
          name: chile-phase2-final-verified
          path: phase2/results
          if-no-files-found: error
          retention-days: 30
